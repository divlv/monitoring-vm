# Single-node K3s with its bundled Traefik (ingress + HTTPS) - the same approach as the
# arck3s sample. config.yaml and all manifests are written BEFORE K3s is installed and
# started, so the first start already picks them up.

- name: K3s - was it installed before this run?
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_bin

- name: K3s - installed version
  ansible.builtin.command: k3s --version
  register: k3s_ver
  changed_when: false
  failed_when: false
  check_mode: false
  when: k3s_bin.stat.exists

- name: K3s - directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: /etc/rancher/k3s, mode: "0755" }
    - { path: "{{ k3s_manifests_dir }}", mode: "0755" }
    # ACME certificates; Traefik runs as 65532 and creates acme_*.json (0600) here.
    - { path: "{{ traefik_data_dir }}", mode: "0700", owner: "{{ traefik_uid }}", group: "{{ traefik_uid }}" }
  loop_control:
    label: "{{ item.path }}"

- name: K3s - data directory of each site's Kuma
  ansible.builtin.file:
    path: "{{ site.data_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ kuma_sites }}"
  loop_control:
    loop_var: site
    label: "{{ site.data_dir }}"

- name: K3s - /etc/rancher/k3s/config.yaml
  ansible.builtin.template:
    src: "{{ templates_dir }}/k3s-config.yaml.j2"
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: "0600"
  register: k3s_config

# K3s watches this directory and (re)applies a file whenever it changes.
- name: K3s - manifests (Traefik config, ACME volume)
  ansible.builtin.template:
    src: "{{ templates_dir }}/{{ item }}.j2"
    dest: "{{ k3s_manifests_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - traefik-config.yaml
    - traefik-acme.yaml

# One manifest (namespace, volume, deployment, service, ingress) per site: a separate Kuma each.
- name: K3s - manifest of each site's Uptime Kuma
  ansible.builtin.template:
    src: "{{ templates_dir }}/uptime-kuma.yaml.j2"
    dest: "{{ k3s_manifests_dir }}/{{ site.manifest }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ kuma_sites }}"
  loop_control:
    loop_var: site
    label: "{{ site.manifest }}"

- name: K3s - download the installer
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /usr/local/share/k3s-install.sh
    owner: root
    group: root
    mode: "0755"
  when: not k3s_bin.stat.exists or k3s_version not in (k3s_ver.stdout | default(''))

- name: K3s - install or move to the pinned version {{ k3s_version }}
  ansible.builtin.command: /usr/local/share/k3s-install.sh
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
  when: not k3s_bin.stat.exists or k3s_version not in (k3s_ver.stdout | default(''))

- name: K3s - restart to pick up a changed config.yaml
  ansible.builtin.systemd_service:
    name: k3s
    state: restarted
  when: k3s_config.changed and k3s_bin.stat.exists and not ansible_check_mode

- name: K3s - wait for the node to be Ready
  ansible.builtin.command: k3s kubectl wait --for=condition=Ready node --all --timeout=60s
  register: k3s_node_ready
  retries: 20
  delay: 10
  until: k3s_node_ready.rc == 0
  changed_when: false
  when: not ansible_check_mode

# On 1 vCPU / 1 GB the helm controller needs 8-10 minutes (first the CRD chart, then Traefik
# itself, with a few restarts of the install job in between), so wait up to 15 minutes.
- name: K3s - wait for Traefik (installed by the helm controller)
  when: not ansible_check_mode
  block:
    - name: K3s - Traefik deployment rolled out
      ansible.builtin.command: k3s kubectl -n kube-system rollout status deployment/traefik --timeout=60s
      register: traefik_ready
      retries: 90
      delay: 10
      until: traefik_ready.rc == 0
      changed_when: false
  rescue:
    # apply/tags: without it the included tasks would be skipped under --tags
    - name: K3s - collect diagnostics
      ansible.builtin.include_tasks:
        file: diagnostics.yml
        apply:
          tags: [always]

    - name: K3s - Traefik did not come up
      ansible.builtin.fail:
        msg: "Traefik did not come up within 15 minutes, see the diagnostics above."

# Traefik orders a certificate only for a domain that has NONE yet, in ANY resolver's store. The
# STAGING certificates (browsers reject them) stay loaded from acme_staging.json, so after the
# switch to production certificates (acme_use_staging: false) the "prod" resolver would never
# order anything and the staging certificate would be served for ever (acme_prod.json stays empty).
# So with the production resolver: move the obsolete staging store aside and restart Traefik once
# (it reads the stores only at start). Later runs find the new store empty and do nothing.
- name: ACME - obsolete staging certificates
  when: acme_resolver == 'prod' and not ansible_check_mode
  block:
    - name: ACME - state of the staging store
      ansible.builtin.stat:
        path: "{{ traefik_data_dir }}/acme_staging.json"
      register: acme_staging_store

    - name: ACME - move the staging store aside
      ansible.builtin.command: "mv {{ traefik_data_dir }}/acme_staging.json {{ traefik_data_dir }}/acme_staging.json.before-production"
      when: acme_staging_store.stat.exists and acme_staging_store.stat.size > 0
      register: acme_staging_moved

    # Stop, wait, start - NOT "rollout restart": a rolling restart runs the old and the new pod side
    # by side, the new one orders the certificate and publishes the challenge token, but Let's
    # Encrypt's validation request can be balanced to the old pod, which does not know the token:
    # "Invalid response ... 404" and the order fails.
    - name: ACME - stop Traefik so that it forgets the staging certificates
      ansible.builtin.command: k3s kubectl -n kube-system scale deployment/traefik --replicas=0
      when: acme_staging_moved is changed

    - name: ACME - wait until the Traefik pod is gone
      ansible.builtin.command: k3s kubectl -n kube-system wait --for=delete pod -l app.kubernetes.io/name=traefik --timeout=120s
      when: acme_staging_moved is changed
      changed_when: false
      failed_when: false

    - name: ACME - start Traefik again (a single pod)
      ansible.builtin.command: k3s kubectl -n kube-system scale deployment/traefik --replicas=1
      when: acme_staging_moved is changed

    - name: ACME - wait for Traefik after the restart
      ansible.builtin.command: k3s kubectl -n kube-system rollout status deployment/traefik --timeout=300s
      when: acme_staging_moved is changed
      changed_when: false
